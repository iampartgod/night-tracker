    <script>
        // Load data from embedded JSON (safer than external file for small data)
        const rawData = document.getElementById('data-json').textContent.trim();
        const data = rawData ? JSON.parse(rawData) : [];

        const today = new Date(); // Real-time current date

        // Excel serial to JS Date (handles 1900 leap bug)
        function serialToDate(serial) {
            const utc_days = Math.floor(serial - 25569);
            const utc_value = utc_days * 86400 * 1000;
            const date_info = new Date(utc_value);
            const fractional_day = serial - Math.floor(serial) + 0.0000001;
            let total_milliseconds = utc_value + fractional_day * 86400 * 1000;
            return new Date(total_milliseconds);
        }

        function daysSince(firstDate) {
            return Math.floor((today - firstDate) / (1000 * 60 * 60 * 24));
        }

        function getPct(days) {
            if (days < 0) return 0;
            if (days < 90) return 0.25;
            if (days < 180) return 0.50;
            if (days < 270) return 0.75;
            return 1.00;
        }

        let totalRedeemable = 0;
        let totalNight = 0;
        const tableData = [];

        data.forEach(item => {
            const firstThaw = serialToDate(item.thaw_serial);
            const days = daysSince(firstThaw);
            const pct = getPct(days);
            const redeemable = item.total_night * pct;

            totalNight += item.total_night;
            totalRedeemable += redeemable;

            tableData.push([
                item.wallet,
                item.account,
                item.total_night.toFixed(2),
                firstThaw.toISOString().split('T')[0],
                (pct * 100) + '%',
                redeemable.toFixed(2)
            ]);
        });

        document.getElementById('stats').innerHTML = `
            <h2>Stats as of ${today.toISOString().split('T')[0]}</h2>
            <p><strong>Total NIGHT:</strong> ${totalNight.toFixed(2)}</p>
            <p><strong>Redeemable NIGHT:</strong> ${totalRedeemable.toFixed(2)}</p>
            <p><strong>Redeemable Percentage:</strong> ${((totalRedeemable / totalNight) * 100).toFixed(2)}%</p>
        `;

        $('#thawTable').DataTable({
            data: tableData,
            pageLength: 50,
            order: [[5, 'desc']],
            columnDefs: [{ targets: [2,5], className: 'dt-right' }]
        });
